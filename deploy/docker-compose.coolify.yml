# Dīwān — déploiement Coolify (Application Docker Compose, sourcée depuis ce repo Git).
# Source de vérité versionnée — équivalent du modèle nizam-os (Afristrat/nexus-os).
#
# Domaine : géré par Coolify via docker_compose_domains (champ « Domains for diwan »
#           dans l'UI), mappé sur le service `diwan` port 8502 → labels Traefik.
# Secret  : OPEN_NOTEBOOK_ENCRYPTION_KEY n'est PAS versionné ici ; il est fourni
#           via les Environment Variables de l'application Coolify.
#
# Build depuis le Dockerfile du repo (fork divergent) : nécessaire dès qu'on
#           modifie le cœur applicatif (code Python/frontend) — l'image upstream
#           lfnovo/open_notebook ne contient pas nos modifications.
#           Le service `diwan` = api (5055) + worker surreal-commands + frontend (8502),
#           SurrealDB reste un service séparé (cf. ci-dessous). Context = racine du repo.

services:
  surrealdb:
    image: surrealdb/surrealdb:v2
    command: start --log info --user root --pass root rocksdb:/mydata/mydatabase.db
    user: root
    volumes:
      - surreal_data:/mydata
    environment:
      - SURREAL_EXPERIMENTAL_GRAPHQL=true
    restart: unless-stopped

  diwan:
    build:
      # Coolify resolves the build context against the app Base Directory ("/",
      # i.e. the repo root), NOT relative to this compose file in deploy/.
      # So context "." = repo root, where the Dockerfile and source live.
      context: .
      dockerfile: Dockerfile
    environment:
      # URL publique : Next.js (8502) proxifie /api/* vers le backend (5055) en interne.
      # Sans cette variable, le frontend auto-détecte http://host:5055 (injoignable depuis le navigateur).
      - API_URL=https://diwan.ai-mpower.com
      - OPEN_NOTEBOOK_ENCRYPTION_KEY=${OPEN_NOTEBOOK_ENCRYPTION_KEY}
      - SURREAL_URL=ws://surrealdb:8000/rpc
      - SURREAL_USER=root
      - SURREAL_PASSWORD=root
      - SURREAL_NAMESPACE=open_notebook
      - SURREAL_DATABASE=open_notebook
      # Facade consommateur (contrat Qalem v1). La variable ne contient QUE des
      # empreintes SHA-256 de jetons, jamais un jeton: Diwan ne detient donc
      # aucune valeur reutilisable, meme si le conteneur est inspecte.
      # Format: consommateur:organisation:empreinte, separes par des virgules.
      # Plusieurs empreintes pour une meme organisation = rotation sans coupure.
      - DIWAN_CONSUMER_TOKENS=${DIWAN_CONSUMER_TOKENS}
      - DIWAN_CONSUMER_MAX_UPLOAD_MB=${DIWAN_CONSUMER_MAX_UPLOAD_MB:-50}
      - DIWAN_CONSUMER_MAX_FILES=${DIWAN_CONSUMER_MAX_FILES:-20}
      - DIWAN_CONSUMER_RATE_LIMIT=${DIWAN_CONSUMER_RATE_LIMIT:-120}
      - DIWAN_CONSUMER_INGEST_RATE_LIMIT=${DIWAN_CONSUMER_INGEST_RATE_LIMIT:-10}
      - DIWAN_CONSUMER_EXTRACTION_CONCURRENCY=${DIWAN_CONSUMER_EXTRACTION_CONCURRENCY:-2}
      - DIWAN_CONSUMER_EMBEDDING_CONCURRENCY=${DIWAN_CONSUMER_EMBEDDING_CONCURRENCY:-2}
      # Modele d'analyse structuree (alignement, contradictions). Un petit
      # modele local rend du JSON valide mais aux types fantaisistes, ce qui
      # degrade l'analyse en insufficient_evidence. Designer ici un modele qui
      # respecte un schema. Vide = modele de transformation par defaut.
      - DIWAN_CONSUMER_ANALYSIS_MODEL=${DIWAN_CONSUMER_ANALYSIS_MODEL:-}
      # Podcast quotidien de veille demande par Saqr. Deux jetons DISTINCTS, un par sens:
      # SAQR_DIWAN_SOURCES_TOKEN (Diwan lit la veille publiee chez Saqr) et
      # DIWAN_SAQR_PODCAST_TOKEN (Diwan rappelle Saqr). Le sens Saqr vers Diwan est
      # authentifie par empreinte dans DIWAN_CONSUMER_TOKENS (entree saqr:...:empreinte).
      # Vides = la fonction repond « echec » au rappel, jamais en silence.
      - SAQR_DIWAN_SOURCES_TOKEN=${SAQR_DIWAN_SOURCES_TOKEN:-}
      - DIWAN_SAQR_PODCAST_TOKEN=${DIWAN_SAQR_PODCAST_TOKEN:-}
      - SAQR_VEILLE_SOURCES_URL=${SAQR_VEILLE_SOURCES_URL:-https://db.saqr.ma/functions/v1/veille-sources}
      - SAQR_VEILLE_CALLBACK_URL=${SAQR_VEILLE_CALLBACK_URL:-https://db.saqr.ma/functions/v1/veille-podcast}
      - SAQR_VEILLE_DEADLINE_MINUTES=${SAQR_VEILLE_DEADLINE_MINUTES:-70}
      - SAQR_VEILLE_MAX_ATTEMPTS=${SAQR_VEILLE_MAX_ATTEMPTS:-5}
      - SAQR_VEILLE_PAGE_URL_TEMPLATE=${SAQR_VEILLE_PAGE_URL_TEMPLATE:-}
      - DIWAN_PUBLIC_URL=${DIWAN_PUBLIC_URL:-https://diwan.ai-mpower.com}
    volumes:
      - notebook_data:/app/data
    depends_on:
      - surrealdb
    restart: unless-stopped

volumes:
  surreal_data:
  notebook_data:
